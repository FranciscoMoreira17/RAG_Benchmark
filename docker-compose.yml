###############################################################################
# RAG Benchmark - Infraestrutura Completa
#
# Serviços:
#   qdrant     → Vector DB (collections separadas por framework E por embedder)
#   phoenix    → Tracing + avaliação (UI: http://localhost:6006)
#   ollama     → LLM juiz local (opcional)
#
# Collections criadas:
#   E5-small  (384 dims) : benchmark_<framework>
#   Qwen3     (1024 dims): benchmark_<framework>_qwen
#
# As duas dimensões coexistem: um embedder nunca escreve na collection do outro.
###############################################################################

services:

  # Qdrant - Vector Store ────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  init-qdrant:
    image: curlimages/curl:latest
    container_name: init-qdrant
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=== A criar collections E5-small (384 dims, cosine) ==="
        for COLLECTION in benchmark_langchain benchmark_llamaindex benchmark_hibrido benchmark_estrutural benchmark_overlap; do
          echo "  -> $$COLLECTION (384)"
          curl -sf -X PUT "http://qdrant:6333/collections/$$COLLECTION" \
            -H "Content-Type: application/json" \
            -d '{"vectors": {"size": 384, "distance": "Cosine"}}' \
            || echo "    (ja existe ou erro)"
        done

        echo ""
        echo "=== A criar collections Qwen3 (1024 dims, cosine) ==="
        for COLLECTION in benchmark_langchain_qwen benchmark_llamaindex_qwen benchmark_hibrido_qwen benchmark_estrutural_qwen benchmark_overlap_qwen; do
          echo "  -> $$COLLECTION (1024)"
          curl -sf -X PUT "http://qdrant:6333/collections/$$COLLECTION" \
            -H "Content-Type: application/json" \
            -d '{"vectors": {"size": 1024, "distance": "Cosine"}}' \
            || echo "    (ja existe ou erro)"
        done

        echo ""
        echo "=== Collections existentes ==="
        curl -sf "http://qdrant:6333/collections" | head -c 800
        echo ""
        echo "=== Pronto ==="

  # Arize Phoenix - Tracing + Avaliação ─────────────────────
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    ports:
      - "6006:6006"   # UI + OTLP HTTP
      - "4317:4317"   # OTLP gRPC
    environment:
      - PHOENIX_TELEMETRY_ENABLED=false
    volumes:
      - phoenix_data:/data
    restart: unless-stopped

  # Ollama - LLM Juiz Local (opcional) ──────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped


volumes:
  qdrant_data:
  phoenix_data:
  ollama_data: